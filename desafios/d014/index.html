<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabelas</title>
  <style>
    table {
      border-collapse: collapse;
      width: 400px;
    }
    
    td, th {
      border: 1px solid black;
      padding 10px
      
    }
    
    th {
      background-color: gray;
      color: white;
    }
    
    th.branco {
      background-color: white;
      color: black;
    }
    
    td.cinza {
      background-color: gray;
      color: white;
    }
    
  </style>
</head>

<body>
  <table>
    <tr>
    <th scope="col" rowspan="2">Area</th>
    <th scope="col" rowspan="2">Disciplinas</th>
    <th colspan="2" scope="rowgroup">Notas</th>
    <th rowspan="2" scope="col">Média</th>
    </tr>
    <tr>
      <th scope="col">Nota 1</th>
      <th scope="col">Nota 2</th>
    </tr>
    <tr>
      <th scope="rowgroup" class="branco" rowspan="5">Exatas</th>
    </tr>
      <tr>
        
      
      <td>
        Matemática
      </td>
      
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <td>Física</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <td>Química</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
      <tr>
        <td>Biologia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
  
    <tr>
      <th colspan="4" scope="row">Média de Exatas</th>
      <td class="cinza">0.0</td>
    </tr>
    <tr>
      <th class="branco" rowspan="2" scope="rowgroup">Humanas</th>
      <td>História</td>
      <td>0.0</td>
      <td>0.0</td>
      <td>0.0</td>
      </tr>
      <tr>
        <td>Geografia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
      </tr>
    <tr>
      <th colspan="4" scope="row">Média de Humanas</th>
      <td class="cinza">0.0</td>
      
    </tr>
  </table>
</body>

</html>
