<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>
<body>
  <h1>Imagem dinâmica</h1>  
  <p>tente abrir esse site em varios dispositivos diferentes
     ou diminua o tamanho do seu navegador</p>
     <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imagem-m.png" type="image/png">
        <img src="imagens/imagem-g.png" alt="Imagem flexivel">
     </picture>
     <hr>
     <h1>Reproduzindo áudio</h1>
     <p>vamos aprendeer a reproduzir áudio em HTML5</p>
     <audio preload="metadata" autoplay controls>
     <source src="midia/happy-mistake.mp3" type="audio/mpeg">
   </audio>
</body>
</html>
