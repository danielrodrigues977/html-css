<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabela</title>
  
  <style>
    
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    
    table {
      border-collapse: collapse;
      width: 400px;
      height: auto;
      margin: auto;
    }
    
    h1 {
      font-size: 20px;
      padding: 30px;
      text-align: center;
    }
    
    caption {
      font-weight: bold;
      padding: 8px;
      background-color: #00000033;
    }
    
    thead, tfoot {
      background-color: #383838;
      color: white;
    }
    
    th, td {
      border: 1px solid black;
      padding: 8px;
    }
    
    tbody > tr:nth-child(2n) {
      background-color: lightgray;
    }
    
    td.num {
      padding: 8px;
      text-align: right;
      width: 50px;
    }
    
  </style>
  
  
</head>

<body>
  <h1>Trabalhando com Tabelas</h1>
  
  <table>
    <caption>Habitantes por Estado</caption>
    <thead>
      <tr>
        <th scope="col">Estado</th>
        <th scope="col">População</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>São Paulo</td>
        <td class="num">000</td>
      </tr>
      <tr>
        <td>Maranhão</td>
        <td class="num">000</td>
      </tr>
      <tr>
        <td>Rio de Janeiro</td>
        <td class="num">000</td>
      </tr>
      <tr>
        <td>Mato Grosso</td>
        <td class="num">000</td>
      </tr>
      <tr>
        <td>Ceará</td>
        <td class="num">000</td>
      </tr>
      <tr>
        <td>Pernambuco</td>
        <td class="num">000</td>
      </tr>
      <tr>
        <td>Pará</td>
        <td class="num">000</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        
      <th scope="row">Total de Habitantes</th>
      <td class="num">000</td>
      
      </tr>
    </tfoot>
  </table>
</body>

</html>
