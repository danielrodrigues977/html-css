<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabelas</title>
  <style>
    table {
      border-collapse: collapse;
      width: 300px;
      height: 300px;
      color: black;
      
    }
  
    
    
    
    td {
      border: 1.5px solid black;
      padding: 8px;
      text-align: center;
    }
    
    td.numero {
      text-align: right;
    }
    
    td.numerosla {
      text-align: left;
    }
    
  </style>
    
  
</head>

<body>
  <h1>tabelas </h1>
  <table>
    <tr>
      <td class="numerosla">
        A1
      </td>
      <td>A2</td>
      <td class="numero">A3</td>
    </tr>
    <tr>
      <td class="numerosla">B1</td>
      <td>B2</td>
      <td class="numero">B3</td>
    </tr>
    <tr>
      <td class="numerosla">
        C1
      </td>
      <td>C2</td>
      <td class="numero">C3</td>
    </tr>
    <tr>
      
    </tr>
  </table>
    
  
</body>

</html>
