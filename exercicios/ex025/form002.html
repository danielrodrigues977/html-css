<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(78, 78, 78);
        }

        h1 {
            color: white;
        }

        form {
            text-align: center;
        }

        form label {
            color: white;
        }

        input.botao {
            width: 200px;
            height: 2em;
            border-radius: 10px;
            border: 0px;
            background-color: gray;
            color: white;
        }

        input.botao:hover {
            border: 1px solid white;
            transform: translate(0px, -1px);
            transition: 0.1s;
        }

        #iusu, #isenha {
            background-color: lightgray;
            border: 0px;
            border-radius: 5px;
            height: 20px;
            box-shadow: 1px 1px 0px black;
        }

        

    </style>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuario:</label>
            
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" placeholder="Nome do Usuario" autocomplete="username">
            
        </p>
        <p>
            <label for="isenha">Senha:</label>
            <input type="password" id="isenha" required minlength="8" maxlength="15" placeholder="Digite sua Senha" autocomplete="current-password">
        </p>
        <p><input type="submit" value="Enviar" class="botao"></p>
        <p><input type="reset" value="limpar"></p>
    </form>
</body>
</html>
