<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
                <p>
                    <label for="inome">Nome</label>
                    <input type="text" name="" id="inome" required placeholder="seu nome">
                </p>
                
                <p>
                    <label for="iemail">E-Mail</label>
                    <input type="email" name="" id="iemail" autocomplete="email" required placeholder="exemplo@gmail.com">
                </p>
                <p>
                    <label for="itel">Telefone</label>
                    <input type="tel" name="" id="itel"  autocomplete="tel" minlength="9" required placeholder="(xx)-xxxx-xxxx">
                </p>
                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>
            
        </fieldset>
    </form>
</body>
</html>
