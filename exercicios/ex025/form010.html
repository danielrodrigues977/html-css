<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>

    <form action="cadastro.php">

        <p>
            <label for="iano">Em que ano você nasceu</label>
            <input type="number" name="" id="iano" min="1900" max="2026" required
            oninput="calcIdade()">
        </p>

        <p>
            <label for="iidade">Idade:</label>
            <output id="iidade">0</output>
        </p>



        <script>
            function calcIdade() {
                let atual = new Date().getFullYear()
                iidade.inerHTML = Number(atual) - Number(iano.value)
            }
        </script>


        <p>
            <input type="submit" name="" id="" value="Enviar">
            <input type="reset" name="" id="" value="Limpar">
        </p>
    </form>
</body>
</html>
